                            <div className="flex flex-col lg:flex-row justify-between items-start gap-12 mb-16 text-left">
                                <div className="max-w-xs">
                                    <CorporateLogo />
                                    <p className="mt-6 text-slate-400 text-xs font-bold leading-relaxed uppercase tracking-widest text-left">
                                        Professional mobility partner for Specialised EXPO Belgrade 2027. We deliver professional stability.
                                    </p>
                                </div>
                                <div className="grid grid-cols-2 gap-12 sm:gap-20">
                                    <div className="flex flex-col gap-4">
                                        <div className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-300">Status</div>
                                        <div className="text-slate-500 font-bold text-xs tracking-tight">Registered Commercial Entity</div>
                                        <div className="text-slate-500 font-bold text-xs tracking-tight">Business Carrier</div>
                                        <div className="text-slate-500 font-bold text-xs tracking-tight">VAT Compliant Partner</div>
                                    </div>
                                    <div className="flex flex-col gap-4">
                                        <div className="text-[10px] font-black uppercase tracking-[0.3em] text-slate-300">Navigation</div>
                                        <a href="#" className="text-blue-600 font-bold text-xs hover:underline">Top</a>
                                        <a href="#planning" className="text-blue-600 font-bold text-xs hover:underline">Advisory</a>
                                        <a href="#fleet" className="text-blue-600 font-bold text-xs hover:underline">Fleet Hub</a>
                                    </div>
                                </div>
                            </div>
                            <div className="pt-8 border-t border-slate-200 flex flex-col md:flex-row justify-between items-center gap-6">
                                <div className="text-[9px] font-black text-slate-400 uppercase tracking-[0.3em]">
                                    © 2025 Belgrade Bespoke Logistics. All rights reserved. Registered Business Entity in Serbia.
                                </div>
                                <div className="flex gap-8 items-center">
                                    <ExpoLogo />
                                </div>
                            </div>
                        </div>
                    </footer>

                    {/* Cookie Consent Banner */}
                    {showCookies && (
                        <div className="fixed bottom-0 left-0 w-full z-[100] p-4 md:p-6 animate-up">

                                <div className="bg-white/95 backdrop-blur-md shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)] border border-slate-200 rounded-[2rem] p-6 md:p-8 flex flex-col md:flex-row items-center justify-between gap-6">
                                    <div className="flex items-center gap-5 text-left">
                                        <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center shrink-0">
                                            <Icon name="Cookie" className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <h4 className="text-slate-900 font-bold text-lg leading-tight">Cookie Settings</h4>
                                            <p className="text-slate-500 text-sm font-medium mt-1">We use cookies to ensure you get the best experience on our website for EXPO 2027 logistics planning.</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3 shrink-0 w-full md:w-auto">

                            </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
